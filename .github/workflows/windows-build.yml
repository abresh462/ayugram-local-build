name: Build AyuGram for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44
      - name: Update MSYS2 package databases
        shell: pwsh
        run: |
          $msys = "Telegram\ThirdParty\msys64\usr\bin\bash.exe"
          if (Test-Path $msys) {
            & $msys -lc "pacman -Syu --noconfirm"
          } else {
            Write-Host "MSYS2 is installed by the dependency preparation step; continuing."
          }
      - name: Prepare build dependencies
        shell: cmd
        run: call Telegram\build\prepare\win.bat
      - name: Configure
        shell: cmd
        working-directory: Telegram
        run: configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
      - name: Build release
        shell: cmd
        working-directory: Telegram
        run: cmake --build out --config Release --target Telegram --parallel 2
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-Release
          path: Telegram/out/Release/
          if-no-files-found: error

